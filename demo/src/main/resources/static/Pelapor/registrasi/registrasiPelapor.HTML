<!DOCTYPE html>
<head>
    <title>Registrasi</title>
    <link rel="stylesheet" href="../registrasi/registrasi.CSS">
</head>
<body>
    <div id="registrasi">
        <img class="bg-img" src="/TUBES/tubes_RPL/demo/src/main/resources/static/assets/background.jpg">
    
        <div id="clearBg">
            <h1>Registrasi</h1>
            <p class="Regis" >buat akun baru</p>

            <form action="#" method="post">
                <label>
                    <span class="form-label">Nama Lengkap</span>
                    <input class="form-control" type="text" name="fullName" placeholder="Masukkan nama lengkap" required>
                </label>
                <td>
                <label>
                    <span class="form-label">NIK</span>
                    <input class="form-control" type="tel" name="NIK" placeholder="Masukkan NIK" required>
                </label>
                <label>
                    <span class="form-label">Nomor Telepon</span>
                    <input class="form-control" type="tel" name="username" placeholder="Masukkan nomor telepon" required>
                </label>
                <td>
                <label>
                    <span class="form-label">Password</span>
                    <input class="form-control" type="password" name="password" placeholder="Masukkan Password" required>
                </label>
                <td>
                <label>
                    <span class="form-label">Re-type Password</span>
                    <input class="form-control" type="password" name="password" placeholder="Masukkan ulang Password" required>
                </label>
                <div class="center-button">
                    <input type="submit" value="Masuk" >
                    <div class="linkBawah">
                        <a href="../Login/pelaporLogin.html"  class="login">Kembali ke Menu Login</a>
                    </div>  
                </div>
            </form>
        </div>
    </div>    
</body>
</html>
