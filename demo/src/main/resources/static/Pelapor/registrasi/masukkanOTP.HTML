<!DOCTYPE html>
<head>
    <title>Document</title>
    <link rel="stylesheet" href="lupaPass.CSS">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family:'Inter', sans-serif ;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #clearBg{
            position: relative;
            z-index: 2;
            width: 326px;
            padding: 40px 26px 48px 26px;
            background: rgba(246, 238, 232, 0.72); /* Semi-transparent warm cream */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid #BF6A02;
            border-radius: 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        #lupaPass{
            position: relative; /* Required for absolute positioning inside */
            width: 402px;
            height: 874px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bg-img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 874px;  /* Matches #loginMobile height */
            height: 402px; /* Matches #loginMobile width */
            object-fit: cover;
            transform: translate(-50%, -50%) rotate(270deg);
            z-index: 1;
            opacity: 0.85;
        }
        h1{
            text-align: center;
            font-size: 25px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            height: 40px;
            padding: 0 14px;
            border: 1.5px solid #C87A19;
            border-radius: 12px;
            background-color: rgba(255, 255, 255, 0.85);
            font-size: 12px;
            text-align: center;
            outline: none;
        }
        /* Styling tombol Masuk */
        .center-button {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }

        .center-button input[type="submit"] {
            width: 100%;
            height: 36px;
            background-color: #C26D00;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .center-button input[type="submit"]:hover {
            background-color: #a35b00;
        }
    </style>
</head>
<body>
    <div id="lupaPass">
        <img class="bg-img" src="/TUBES/tubes_RPL/demo/src/main/resources/static/assets/background.jpg">
    
        <div id="clearBg">
            <h1>Masukan Kode OTP</h1>
            <form action="#" method="post">
                <label>
                    <input class="form-control" type="text" name="username" placeholder="Masukkan nomor telepon" required>
                </label>
                <div class="center-button">
                    <input type="submit" value="Kirim ulang Kode OTP" >
                    <td>
                    <input type="submit" value="Verifikasi Kode" >
                </div>
            </form>
        </div>
    </div>
</body>
</html>
